[project]
name = "akpedia-ml"
version = "0.1.0"
description = "Serviço de ML e processamento de documentos do Akpedia (Python + FastAPI)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# Conjunto propositalmente enxuto: pega problemas reais sem impor estilo rígido.
# E (pycodestyle), F (pyflakes), I (isort), UP (pyupgrade), B (bugbear).
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
