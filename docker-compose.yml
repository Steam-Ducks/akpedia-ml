services:
  app:
    build:
      context: .
      target: dev
    container_name: akpedia-ml
    user: "1000:1000"
    environment:
      APP_PORT: ${APP_PORT:-8000}
      HF_HOME: /cache/hf
      # Repassadas vazias quando não definidas no .env: a aplicação aplica o default.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-}
      MAX_QUERY_CHARS: ${MAX_QUERY_CHARS:-}
    volumes:
      - .:/app
      - model-cache:/cache
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  model-cache:
