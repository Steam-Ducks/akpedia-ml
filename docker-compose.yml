services:
  app:
    build:
      context: .
      target: dev
    container_name: akpedia-ml
    user: "1000:1000"
    environment:
      APP_PORT: ${APP_PORT:-8000}
      HF_HOME: /cache/hf
      # Repassadas vazias quando não definidas no .env: a aplicação aplica o default.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-}
      CENTROIDS_PATH: ${CENTROIDS_PATH:-}
      ANALYSIS_MAX_CHUNKS: ${ANALYSIS_MAX_CHUNKS:-}
      CATEGORY_TEMPERATURE: ${CATEGORY_TEMPERATURE:-}
      # Modelo de linguagem local: o Ollama é alcançado pelo nome do serviço.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-}
      LLM_CONTEXT_TOKENS: ${LLM_CONTEXT_TOKENS:-}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-}
    volumes:
      - .:/app
      - model-cache:/cache
    ports:
      - "${APP_PORT:-8000}:8000"

  # Indexa os documentos aprovados: mesma imagem da API, outro comando, e sobe junto com ela.
  # O Redis sobe no compose do akpedia-server (container akpedia-redis, rede akpedia-net):
  # suba aquele primeiro, ou este compose não encontra a rede.
  worker:
    build:
      context: .
      target: dev
    user: "1000:1000"
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    # O SIGTERM só é atendido entre documentos; um PDF grande leva dezenas de segundos para
    # embedar, e os 10 s padrão matariam o worker no meio dele, deixando a mensagem pendente.
    stop_grace_period: 2m
    environment:
      HF_HOME: /cache/hf
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-}
      # Redis é alcançado pelo nome do container, na rede akpedia-net.
      REDIS_URL: ${REDIS_URL:-redis://akpedia-redis:6379/0}
      DOCUMENTS_STREAM: ${DOCUMENTS_STREAM:-}
      WORKER_GROUP: ${WORKER_GROUP:-}
      # Nome fixo: com o hostname (o id do container), cada container recriado entraria no
      # group com um nome novo e as mensagens pendentes do anterior ficariam órfãs.
      # Ao escalar para mais de uma réplica, dê um nome diferente a cada uma.
      WORKER_CONSUMER: ${WORKER_CONSUMER:-akpedia-ml-worker}
      # O akpedia-server roda fora deste compose: por padrão, no host.
      SERVER_BASE_URL: ${SERVER_BASE_URL:-http://host.docker.internal:8080}
      # Segredo das rotas /internal do server. O compose do akpedia-server cai no mesmo valor
      # de desenvolvimento; fora do ambiente local, defina um de verdade nos dois lados.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-akpedia-dev-internal-token}
      SERVER_TIMEOUT_SECONDS: ${SERVER_TIMEOUT_SECONDS:-}
    volumes:
      - .:/app
      - model-cache:/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - akpedia-net

  # Modelo de linguagem local (Ollama). Sem porta publicada no host: só a API deste
  # compose fala com ele, e nenhum texto de documento sai da máquina. Os pesos ficam no
  # volume ollama-models; baixe o modelo uma vez com:
  #   docker compose exec ollama ollama pull qwen2.5:3b-instruct
  ollama:
    image: ollama/ollama:0.12.6
    container_name: akpedia-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama

volumes:
  model-cache:
  ollama-models:

networks:
  # Criada pelo compose do akpedia-server, dono do Redis.
  akpedia-net:
    external: true
